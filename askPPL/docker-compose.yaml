services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: askppl_db
      POSTGRES_USER: askppl_user
      POSTGRES_PASSWORD: askppl_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env.docker
    depends_on:
      - db

volumes:
  postgres_data: