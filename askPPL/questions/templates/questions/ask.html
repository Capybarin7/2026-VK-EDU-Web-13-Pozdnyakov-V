{% extends 'base.html' %}
{% block content %}
            <h1>New Question</h1>
            <form class="newquest">
            <div>
            <label for="message1">Title</label>
            <textarea id="message1" name="message1" placeholder="Enter title..."></textarea>
            </div>
            <div>
            <label for="message2">Text</label>
            <textarea id="message2" name="message2" placeholder="Enter text..."></textarea>
            </div>
            <div>
            <label for="message3">Tags</label>
            <textarea id="message3" name="message3" placeholder="Enter tags (Optional: Add tags separated by commas)..."></textarea>
            </div>
            <button class="askquest" type="submit">ASK!</button>
        </form>
{% endblock %}
