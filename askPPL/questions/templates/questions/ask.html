{% extends 'base.html' %}
{% block content %}
<h2>New Question</h2>
<form method="post">
    {% csrf_token %}
    {% if form.errors %}
        <div class="alert alert-danger">
            {% for field in form %}
                {% for error in field.errors %}
                    <p>{{ error }}</p>
                {% endfor %}
            {% endfor %}
        </div>
    {% endif %}
    <div class="mb-3">
        <label>Title</label>
        {{ form.name }}
    </div>
    <div class="mb-3">
        <label>Text</label>
        {{ form.text }}
    </div>
    <div class="mb-3">
        <label>Tags</label>
        {{ form.tags_input }}
    </div>
    <button type="submit" class="btn btn-primary w-100">ASK!</button>
</form>
{% endblock %}
