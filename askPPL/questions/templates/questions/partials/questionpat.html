<section class="question">
                        <div class="photolike">
                        <div class="d-flex flex-column align-items-center gap-3">
                        <img class="rounded-circle object-fit-cover" src="{{ MEDIA_URL }}{{ obj.author.avatar }}" alt="Avatar" onerror="this.src='https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRs_l_LMJ0HukBt8HPg4hVDXxy3_4uct5DgDnes0ask6g&s'">
                        </div>
                        </div>
                        <div>
                        <a class="quest" href="{% url 'question_detail' obj.id %}">{{ obj.name }}</a>
                        <p class="questtext text-truncate">{{ obj.text }}</p>
                        <div class="d-flex align-items-center gap-3">
                        <a href="{% url 'question_detail' obj.id %}">answers({{ obj.answers_count }})</a>
                        <span>Tags:</span>
                        {% for tag in obj.tags.all %}
                            <a href="{% url 'tag' tag.name %}">{{ tag.name }}</a>
                            {% endfor %}
                        </div>
                        </div>
                        <div class="input-group input-group-sm w-auto ms-auto">
                        <span class="input-group-text bg-white fw-bold px-2" id="question-like-count-{{ obj.id }}">{{ obj.likes_count }}</span>
                        {% if user.is_authenticated %}
                            <div class="btn-group-vertical">
                            <button type="button" id="like-btn-q-{{ obj.id }}" class="btn btn-outline-secondary p-0 px-1 lh-1 border-bottom-0 rounded-0 fs-6" onclick="likeQuestion({{ obj.id }}, this)" {% if obj.id in liked_q %}disabled{% endif %}>▲</button>
                            <button type="button" id="unlike-btn-q-{{ obj.id }}" class="btn btn-outline-secondary p-0 px-1 lh-1 rounded-0 fs-6" onclick="unlikeQuestion({{ obj.id }}, this)" {% if obj.id not in liked_q %}disabled{% endif %}>▼</button>
                            </div>
                        {% else %}
                        <div class="btn-group-vertical" title="Log in to vote on this question">
                            <button type="button" class="btn btn-outline-secondary p-0 px-1 lh-1 border-bottom-0 rounded-0 fs-6" disabled>▲</button>
                            <button type="button" class="btn btn-outline-secondary p-0 px-1 lh-1 rounded-0 fs-6" disabled>▼</button>
                        </div>
                        {% endif %}
                        </div>
                    </section>
