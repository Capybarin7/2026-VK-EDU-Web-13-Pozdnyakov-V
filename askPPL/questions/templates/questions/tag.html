{% extends 'base.html' %}
{% block content %}
            <div>
                <div class="d-flex align-items-center gap-3">
                    <h1>Tag: {{ tag }}</h1>
                </div>
                <div class="allquest">
                    {% for question in questions %}
                    {% include 'questions/partials/questionpat.html' with obj=question %}
                    {% empty %}
                    <p class="text-muted">Вопросы с тэгом "{{ tag }}" не найдены.</p>
                    {% endfor %}
                    {% include 'questions/partials/pagination.html' %}
                </div>
            </div>
{% endblock %}
